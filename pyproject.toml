[project]
name = "wald-likelihood-support"
version = "0.1.0"
description = "Static client-side app for normalized Wald relative support reconstructed from a reported estimate and 95% confidence interval"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Brian Locke" },
]
maintainers = [
  { name = "Brian Locke" },
]
keywords = [
  "relative-likelihood",
  "support-interval",
  "confidence-interval",
  "wald-inference",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.2.5,<2.3",
  "wald-inference @ https://github.com/reblocke/wald-inference-core/releases/download/v0.2.1/wald_inference-0.2.1-py3-none-any.whl#sha256=dcede569ff923061313635f2f680de9e3f8d1ea9415ef1b9391a0756023212fc",
]

[project.urls]
Repository = "https://github.com/reblocke/wald-likelihood-support"
Issues = "https://github.com/reblocke/wald-likelihood-support/issues"
Documentation = "https://github.com/reblocke/wald-likelihood-support/blob/main/docs/SCIENTIFIC_SCOPE.md"
Hosted = "https://reblocke.github.io/wald-likelihood-support/"

[dependency-groups]
dev = [
  "hypothesis>=6.151,<7",
  "playwright>=1.55,<2",
  "pytest>=8.2,<9",
  "pytest-playwright>=0.7,<1",
  "ruff>=0.15.1,<1",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wald_likelihood_support = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-q"]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "e2e: browser end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["wald_likelihood_support"]
